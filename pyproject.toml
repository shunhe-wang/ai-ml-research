[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rule-carryover"
version = "0.1.0"
description = "Reproducible experiments on cross-case history effects in executable rule decisions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
mlx = ["mlx-lm==0.31.3", "certifi>=2026.10.19"]

[project.scripts]
carryover = "rule_carryover.cli:entrypoint"

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "reportlab>=4.4,<5",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rule_carryover"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["rule_carryover"]
